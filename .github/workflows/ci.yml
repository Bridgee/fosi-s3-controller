name: Firmware
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check_repository.py
      - run: python tools/prepare.py
      - run: pio run -e orbit-demo -e orbit-live-check -e orbit-intro-mock -e orbit-ai-check
      - run: python tools/test_native.py
      - run: python tools/test_preview_sync.py
      - run: node tools/test_preview_parity.cjs
      - run: node tools/test_preview_transitions.cjs
      - run: node tools/test_music_intro.cjs
      - run: python tools/test_swipes.py
      - run: python tools/test_preview_lyrics.py
      - run: python tools/test_preview_server.py
      - run: python tools/test_ui.py
