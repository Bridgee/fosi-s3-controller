name: Simulator Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: python tools/check_repository.py
      - run: python tools/sync_preview.py --check
      - run: python tools/test_pages.py
      - run: node tools/test_preview_parity.cjs
      - run: node tools/test_simulator_guide.cjs
      - run: node tools/test_clock_ui.cjs
      - run: node tools/test_clock_slots.cjs
      - run: node tools/test_preview_transitions.cjs
      - run: node tools/test_music_intro.cjs
      - run: python tools/test_preview_lyrics.py
      - run: python tools/build_pages.py
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
