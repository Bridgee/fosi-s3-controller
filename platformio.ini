[platformio]
core_dir = .pio-core
default_envs = orbit-demo
src_dir = firmware/OrbitS3
boards_dir = .deps/LilyGo-T-RGB/boards
include_dir = include

[env]
platform = espressif32@6.9.0
board = LilyGo-T-RGB
framework = arduino
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_speed = 921600
lib_extra_dirs = .deps
extra_scripts = pre:tools/build_guard.py
lib_deps =
    lvgl/lvgl @ 8.4.0
    lewisxhe/SensorLib @ 0.2.3
    bodmer/TFT_eSPI @ 2.5.43
    moononournation/GFX Library for Arduino @ 1.5.0
    bblanchon/ArduinoJson @ 6.21.6
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    ; Relative to .pio/libdeps/<env>/lvgl/src; avoids macro expansion of
    ; the ESP32 token in this project's absolute directory name.
    -DLV_CONF_PATH=../../../../../include/lv_conf.h
    -DLV_CONF_SUPPRESS_DEFINE_CHECK
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DLODEPNG_MAX_ALLOC=2097152

[env:orbit-demo]
build_flags = ${env.build_flags} -DORBIT_LIVE=0

[env:orbit-live]
build_flags = ${env.build_flags} -DORBIT_LIVE=1

; Link-check the complete network implementation without personal credentials.
; This target is for verification only, not for uploading to the display.
[env:orbit-live-check]
build_flags =
    ${env.build_flags}
    -DORBIT_LIVE=1
    -DORBIT_BUILD_CHECK=1
    '-DORBIT_WIFI_SSID="BUILD_CHECK_ONLY"'
    '-DORBIT_S3_URL=""'


; Local compilation/preview only. Upload guard forbids this sample-data target.
[env:orbit-intro-mock]
extends = env:orbit-demo
build_flags = ${env:orbit-demo.build_flags} -DORBIT_BUILD_CHECK=1 -DORBIT_INTRO_MOCK=1

; Compile/link real transport, but runtime disabled and private config excluded.
[env:orbit-ai-check]
extends = env:orbit-live-check
build_flags = ${env:orbit-live-check.build_flags} -DORBIT_AI_TRANSPORT_CHECK=1 -Wl,--undefined=orbit_ai_link_probe -Wl,--undefined=orbit_ai_runtime_link_probe
